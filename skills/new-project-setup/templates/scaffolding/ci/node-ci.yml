name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match package.json's engines.node, so "N/N tests passing" doesn't depend on
          # whoever's local Node happened to run it.
          node-version: "{{NODE_VERSION}}"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
